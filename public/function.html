<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algowhiz — Algorithm Visualizer</title>
    <link rel="shortcut icon" type="image/png" href="algowhiz-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://css.hackclub.com/theme.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://css.hackclub.com/fonts.css">
</head>
<body>
    <header class="header">
        <div class="container headerholder">
            <a href="index.html" style="text-decoration:none;color:inherit"><h1 class="title">algowhiz!</h1></a>
            <div class="rightside">
                <div class="control-group">
                    <label for="algorithm-select" class="control-label">Algorithm</label>
                    <select id="algorithm-select">
                        <optgroup label="Sorting">
                            <option value="bubble-sort">Bubble Sort</option>
                            <option value="selection-sort">Selection Sort</option>
                            <option value="insertion-sort">Insertion Sort</option>
                            <option value="quick-sort">Quick Sort</option>
                            <option value="merge-sort">Merge Sort</option>
                            <option value="heap-sort">Heap Sort</option>
                        </optgroup>
                        <optgroup label="Pathfinding">
                            <option value="a-star">A* Search</option>
                            <option value="dijkstra">Dijkstra's</option>
                        </optgroup>
                    </select>
                </div>

                <div class="control-group">
                    <label class="control-label">Speed</label>
                    <div class="speed-wrapper">
                        <span class="speed-label">🐢</span>
                        <input type="range" id="speed-control" min="1" max="100" step="1" value="20">
                        <span class="speed-label">🐇</span>
                    </div>
                </div>

                <div class="btn-group">
                    <button id="run-btn" class="btn btn-primary">▶ Run</button>
                    <button id="reset-btn" class="btn btn-secondary">↺ Reset</button>
                </div>

                <button id="dark-mode-toggle" class="btn-icon" title="Toggle dark mode">
                    <svg viewBox="0 0 32 32" width="22" height="22" fill="currentcolor">
                        <circle cx="16" cy="16" r="14" fill="none" stroke="currentcolor" stroke-width="4"></circle>
                        <path d="M 16 0 A 16 16 0 0 0 16 32 z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Algorithm Info Panel -->
    <div class="container">
        <div id="algo-info" class="algo-info-panel">
            <div class="algo-info-content">
                <h2 id="algo-info-name">Bubble Sort</h2>
                <p id="algo-info-desc">Repeatedly steps through the list, compares adjacent elements and swaps them if they are in the wrong order.</p>
            </div>
            <div class="algo-info-badges">
                <span class="badge badge-time" id="algo-info-time">⏱ O(n²)</span>
                <span class="badge badge-space" id="algo-info-space">💾 O(1)</span>
                <span class="badge badge-stable" id="algo-info-stable">✓ Stable</span>
            </div>
        </div>
    </div>

    <div class="container card maincard">
        <!-- Step Counter -->
        <div id="step-counter" class="step-counter" style="display:none;">
            <span>Step <strong id="current-step-num">0</strong> / <strong id="total-steps">0</strong></span>
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>

        <!-- Sorting View -->
        <div id="sorting-container" style="display: none;">
            <div class="controls sorting-controls">
                <input type="text" id="array-input" placeholder="Enter numbers: 5, 3, 8, 1, 9 (or leave blank for random)" />
                <button id="randomize-btn" class="btn btn-accent">🎲 Randomize</button>
            </div>
            <div id="array-container" class="array-container"></div>
        </div>

        <!-- Pathfinding View -->
        <div id="pathfinding-container" style="display: none;">
            <div class="controls pathfinding-controls">
                <button id="set-start-btn" class="btn btn-green">📍 Set Start</button>
                <button id="set-end-btn" class="btn btn-red">🏁 Set End</button>
                <button id="set-obstacle-btn" class="btn btn-steel">🧱 Draw Walls</button>
                <button id="generate-maze-btn" class="btn btn-accent">🌀 Random Maze</button>
                <button id="clear-grid-btn" class="btn btn-secondary">🗑 Clear Grid</button>
            </div>
            <div class="grid-wrapper">
                <div id="grid-container" class="grid-container"></div>
            </div>
        </div>
    </div>

    <div id="feedback" class="feedback"></div>

    <div id="loading-spinner" class="spinner hidden">
        <div class="double-bounce1"></div>
        <div class="double-bounce2"></div>
    </div>

    <script src="script.js"></script>
    <script src="switch.js"></script>
</body>
</html>
